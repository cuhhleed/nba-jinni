name: Terraform CI

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: 1.10.0
  AWS_REGION: us-east-1
  TF_STATE_BUCKET: nbajinni-terraform-state
  TF_LOCK_TABLE: nbajinni-terraform-locks
  TF_WORKING_DIR_DEV: infra/environments/dev
  TF_WORKING_DIR_PROD: infra/environments/prod

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: infra

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        continue-on-error: true
        run: terraform plan -no-color -input=false -out=tfplan
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project_name: nbajinni
          TF_VAR_environment: dev
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Post plan comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- terraform-plan-dev -->';
            const maxLen = 60000;
            let planOut = `${{ steps.plan.outputs.stdout }}`;
            let truncated = false;
            if (planOut.length > maxLen) {
              planOut = planOut.substring(0, maxLen);
              truncated = true;
            }
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              marker,
              `### Terraform Plan — dev`,
              ``,
              `**Run:** [${runUrl}](${runUrl})`,
              `**Commit:** \`${{ github.sha }}\``,
              ``,
              `| Step | Outcome |`,
              `|---|---|`,
              `| fmt | \`${{ steps.plan.outcome == 'success' && 'pass' || 'see run' }}\` |`,
              `| init | \`${{ steps.plan.outcome == 'success' && 'pass' || 'see run' }}\` |`,
              `| validate | \`${{ steps.plan.outcome == 'success' && 'pass' || 'see run' }}\` |`,
              `| plan | \`${{ steps.plan.outcome }}\` |`,
              ``,
              `<details><summary>Plan output</summary>`,
              ``,
              `\`\`\``,
              planOut,
              `\`\`\``,
              truncated ? `\n_Output truncated. [See full output in the workflow run.](${runUrl})_` : '',
              `</details>`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-apply-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build loader.zip
        working-directory: ${{ github.workspace }}
        run: bash scripts/package_loader.sh

      - name: Upload loader.zip to S3
        working-directory: ${{ github.workspace }}
        run: aws s3 cp infra/loader.zip s3://nbajinni-dev-lambda-artifacts/loader.zip

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project_name: nbajinni
          TF_VAR_environment: dev
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Terraform output
        run: terraform output -no-color

  # NOTE: This job will fail at terraform init until infra/environments/prod/ exists. See FEATURE-008 / Story 7.2 plan.
  apply-prod:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: terraform-apply-prod
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR_PROD }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.TF_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build loader.zip
        working-directory: ${{ github.workspace }}
        run: bash scripts/package_loader.sh

      - name: Upload loader.zip to S3
        working-directory: ${{ github.workspace }}
        run: aws s3 cp infra/loader.zip s3://nbajinni-prod-lambda-artifacts/loader.zip

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -no-color -input=false
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project_name: nbajinni
          TF_VAR_environment: prod
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_aws_region: ${{ env.AWS_REGION }}
          TF_VAR_project_name: nbajinni
          TF_VAR_environment: prod
          TF_VAR_db_username: ${{ secrets.DB_USERNAME }}
          TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

      - name: Terraform output
        run: terraform output -no-color
